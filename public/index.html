<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JepongDevxyz - YT4U Downloader</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); width: 100%; max-width: 400px; text-align: center; }
        input { width: 90%; padding: 12px; margin-bottom: 15px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; }
        button { background: #ef4444; color: white; border: none; padding: 12px 20px; width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; }
        button:hover { opacity: 0.9; }
        #status { margin-top: 15px; font-size: 14px; color: #94a3b8; }
        .result-box { margin-top: 15px; display: none; text-align: left; }
        .result-box a { display: block; margin-top: 8px; padding: 10px; border-radius: 6px; text-decoration: none; font-weight: bold; color: white; text-align: center; }
        .dl-mp3 { background: #ef4444; }
        .dl-mp4 { background: #3b82f6; }
    </style>
</head>
<body>
    <div class="card">
        <h2>YT4U Downloader</h2>
        <form id="downloadForm">
            <input type="text" id="url" placeholder="I-paste ang YouTube URL dito..." required>
            <button type="submit" id="submitBtn">Hanapin ang Links</button>
        </form>
        <div id="status"></div>
        <div class="result-box" id="resultBox">
            <h4 id="videoTitle" style="font-size: 13px; margin-bottom: 10px; color: #cbd5e1; text-align: center;"></h4>
            <a id="mp3Link" href="#" class="dl-mp3" target="_blank">Download MP3 (Audio)</a>
            <a id="mp4Link" href="#" class="dl-mp4" target="_blank">Download MP4 (Video)</a>
        </div>
    </div>
    <script>
        const form = document.getElementById('downloadForm');
        const statusDiv = document.getElementById('status');
        const submitBtn = document.getElementById('submitBtn');
        const resultBox = document.getElementById('resultBox');
        const videoTitle = document.getElementById('videoTitle');
        const mp3Link = document.getElementById('mp3Link');
        const mp4Link = document.getElementById('mp4Link');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const videoUrl = document.getElementById('url').value;
            statusDiv.innerText = "Hinahanap ang media links...";
            submitBtn.disabled = true;
            resultBox.style.display = 'none';
            try {
                const res = await fetch(`/api/download?url=${encodeURIComponent(videoUrl)}`);
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'May nangyaring error.');
                videoTitle.innerText = data.title;
                mp3Link.href = data.mp3Url;
                mp4Link.href = data.mp4Url;
                statusDiv.innerText = "Tagumpay! Piliin ang format sa ibaba:";
                resultBox.style.display = 'block';
            } catch (err) {
                statusDiv.innerText = "Nagka-error: " + err.message;
            } finally {
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Downloader - YT4U</title>
    <style>
        :root {
            --bg-color: #f4f5f7;
            --card-bg: #ffffff;
            --text-main: #111111;
            --text-sub: #666666;
            --border-color: #cccccc;
            --input-bg: #ffffff;
            --status-bg: #fafafa;
            --footer-bg: #ffffff;
            --footer-border: #eaeaea;
            --dropdown-bg: #ffffff;
            --dropdown-hover: #f0f0f0;
            --primary: #00a2ff;
            --primary-hover: #0086d6;
            --shadow: rgba(0, 0, 0, 0.08);
            --toast-bg: #111111;
            --toast-text: #ffffff;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #121212;
                --card-bg: #1e1e1e;
                --text-main: #f1f1f1;
                --text-sub: #a0a0a0;
                --border-color: #333333;
                --input-bg: #2a2a2a;
                --status-bg: #252525;
                --footer-bg: #1e1e1e;
                --footer-border: #2a2a2a;
                --dropdown-bg: #2a2a2a;
                --dropdown-hover: #383838;
                --shadow: rgba(0, 0, 0, 0.4);
                --toast-bg: #2a2a2a;
                --toast-text: #00a2ff;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            color: var(--text-main);
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
            width: 100%;
        }

        h2 {
            font-size: 28px;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        p.subtitle {
            color: var(--text-sub);
            font-size: 14px;
            margin-bottom: 25px;
            max-width: 550px;
        }

        .converter-box {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 20px var(--shadow);
            width: 100%;
            max-width: 550px;
            transition: background 0.3s;
        }

        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            position: relative;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            width: 100%;
            background: var(--input-bg);
            color: var(--text-main);
            transition: border-color 0.2s, background 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        .custom-dropdown {
            position: relative;
            user-select: none;
        }

        .dropdown-trigger {
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--input-bg);
            color: var(--text-main);
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            height: 100%;
            transition: border-color 0.2s, background 0.3s;
        }

        .dropdown-trigger:hover {
            border-color: var(--primary);
        }

        .dropdown-arrow {
            font-size: 10px;
            transition: transform 0.2s ease;
        }

        .custom-dropdown.active .dropdown-arrow {
            transform: rotate(180deg);
        }

        .dropdown-menu {
            position: absolute;
            top: calc(100% + 6px);
            right: 0;
            width: 100px;
            background: var(--dropdown-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-shadow: 0 8px 24px var(--shadow);
            display: none;
            flex-direction: column;
            overflow: hidden;
            z-index: 100;
            opacity: 0;
            transform: translateY(-8px);
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .custom-dropdown.active .dropdown-menu {
            display: flex;
            opacity: 1;
            transform: translateY(0);
        }

        .dropdown-option {
            padding: 10px 14px;
            font-size: 14px;
            font-weight: bold;
            color: var(--text-main);
            cursor: pointer;
            text-align: left;
            transition: background 0.15s;
        }

        .dropdown-option:hover {
            background: var(--dropdown-hover);
            color: var(--primary);
        }

        .dropdown-option.selected {
            color: var(--primary);
            background: var(--dropdown-hover);
        }

        button.convert-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }

        button.convert-btn:hover {
            background-color: var(--primary-hover);
        }

        #statusBox {
            margin-top: 15px;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--status-bg);
            font-size: 14px;
            color: var(--text-main);
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid var(--border-color);
            border-top: 2px solid var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .result-box {
            margin-top: 15px;
            display: none;
            text-align: left;
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
        }

        .video-preview {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 8px;
            margin-bottom: 12px;
            overflow: hidden;
        }

        .video-preview iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .result-box p {
            font-size: 13px;
            font-weight: bold;
            color: var(--text-sub);
            margin-bottom: 10px;
            word-break: break-all;
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn-download-action {
            display: block;
            width: 100%;
            background-color: var(--primary);
            color: white;
            text-align: center;
            padding: 12px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            box-sizing: border-box;
            transition: background 0.2s;
        }

        .btn-download-action:hover {
            background-color: var(--primary-hover);
        }

        .btn-another-action {
            display: block;
            width: 100%;
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-another-action:hover {
            background-color: var(--dropdown-hover);
        }

        .counter-badge {
            margin-top: 20px;
            font-size: 13px;
            color: var(--text-sub);
            background: var(--card-bg);
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            display: inline-block;
        }

        .counter-badge span {
            color: var(--primary);
            font-weight: bold;
        }

        .toast-container {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--toast-bg);
            color: var(--toast-text);
            border: 1px solid var(--border-color);
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 8px 20px var(--shadow);
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 1000;
            opacity: 0;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
            pointer-events: none;
            max-width: 90%;
            width: max-content;
        }

        .toast-container.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
            pointer-events: auto;
        }

        .toast-close {
            background: none;
            border: none;
            color: currentColor;
            font-size: 16px;
            cursor: pointer;
            opacity: 0.7;
            padding: 0 0 0 8px;
            line-height: 1;
        }

        .toast-close:hover {
            opacity: 1;
        }

        footer {
            text-align: center;
            padding: 15px;
            font-size: 12px;
            color: var(--text-sub);
            background: var(--footer-bg);
            border-top: 1px solid var(--footer-border);
            width: 100%;
            transition: background 0.3s;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>YT4U - YouTube Downloader</h2>
        <p class="subtitle">YT4U is an online tool that lets you convert YouTube videos into MP3 or MP4 files and download them for free.</p>
        
        <div class="converter-box">
            <form id="downloadForm">
                <div class="input-group">
                    <input type="text" id="url" placeholder="YouTube Link" required>
                    
                    <div class="custom-dropdown" id="customDropdown">
                        <div class="dropdown-trigger" id="dropdownTrigger">
                            <span id="selectedFormatText">MP3</span>
                            <span class="dropdown-arrow">▼</span>
                        </div>
                        <div class="dropdown-menu">
                            <div class="dropdown-option selected" data-value="mp3">MP3</div>
                            <div class="dropdown-option" data-value="mp4">MP4</div>
                        </div>
                    </div>
                </div>
                <button type="submit" class="convert-btn" id="submitBtn">Generate <span id="btnFormatText">MP3</span></button>
            </form>
            
            <div id="statusBox">
                <div class="spinner"></div>
                <span id="statusText">preparing conversion</span>
            </div>

            <div class="result-box" id="resultBox">
                <div class="video-preview" id="videoPreviewContainer"></div>
                <p id="videoTitle"></p>
                <div class="action-buttons">
                    <a id="downloadLink" href="#" class="btn-download-action" target="_blank" rel="noopener noreferrer">Download</a>
                    <button id="generateAnotherBtn" class="btn-another-action">Generate Another</button>
                </div>
            </div>
        </div>

        <div class="counter-badge">
            Total Generated: <span id="counterValue">0</span>
        </div>
    </div>

    <div id="toast" class="toast-container">
        <span id="toastText">Powered by Jepong Devxyz</span>
        <button class="toast-close" id="toastCloseBtn">&times;</button>
    </div>

    <footer>
        &copy; Jepong Devxyz - YT4U - 2026. All rights reserved.
    </footer>

    <script>
        const form = document.getElementById('downloadForm');
        const statusBox = document.getElementById('statusBox');
        const statusText = document.getElementById('statusText');
        const submitBtn = document.getElementById('submitBtn');
        const resultBox = document.getElementById('resultBox');
        const videoTitle = document.getElementById('videoTitle');
        const downloadLink = document.getElementById('downloadLink');
        const btnFormatText = document.getElementById('btnFormatText');
        const generateAnotherBtn = document.getElementById('generateAnotherBtn');
        const videoPreviewContainer = document.getElementById('videoPreviewContainer');
        const urlInput = document.getElementById('url');
        const counterValue = document.getElementById('counterValue');

        // Toast Notification
        const toast = document.getElementById('toast');
        const toastText = document.getElementById('toastText');
        const toastCloseBtn = document.getElementById('toastCloseBtn');
        let toastTimeout;

        function showToast(msg) {
            clearTimeout(toastTimeout);
            toastText.innerText = msg;
            toast.classList.add('show');
            
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3500);
        }

        toastCloseBtn.addEventListener('click', () => {
            toast.classList.remove('show');
        });

        // Real-time Global Counter Functions
        async function fetchGlobalCount() {
            try {
                const res = await fetch('/api/counter');
                const data = await res.json();
                if (data.count !== undefined) {
                    counterValue.innerText = data.count;
                }
            } catch (err) {
                console.error("Failed to fetch counter", err);
            }
        }

        async function incrementGlobalCounter() {
            try {
                const res = await fetch('/api/counter', { method: 'POST' });
                const data = await res.json();
                if (data.count !== undefined) {
                    counterValue.innerText = data.count;
                }
            } catch (err) {
                console.error("Failed to increment counter", err);
            }
        }

        fetchGlobalCount();
        setInterval(fetchGlobalCount, 3000);

        // Custom Dropdown Logic
        const customDropdown = document.getElementById('customDropdown');
        const dropdownTrigger = document.getElementById('dropdownTrigger');
        const selectedFormatText = document.getElementById('selectedFormatText');
        const dropdownOptions = document.querySelectorAll('.dropdown-option');
        let selectedFormat = 'mp3';

        dropdownTrigger.addEventListener('click', (e) => {
            e.stopPropagation();
            customDropdown.classList.toggle('active');
        });

        dropdownOptions.forEach(option => {
            option.addEventListener('click', (e) => {
                e.stopPropagation();
                dropdownOptions.forEach(opt => opt.classList.remove('selected'));
                option.classList.add('selected');
                
                selectedFormat = option.getAttribute('data-value');
                selectedFormatText.innerText = selectedFormat.toUpperCase();
                btnFormatText.innerText = selectedFormat.toUpperCase();
                
                customDropdown.classList.remove('active');
            });
        });

        document.addEventListener('click', () => {
            customDropdown.classList.remove('active');
        });

        function extractYouTubeID(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const videoUrl = urlInput.value.trim();
            
            submitBtn.disabled = true;
            resultBox.style.display = 'none';
            statusBox.style.display = 'flex';

            const steps = [
                "preparing conversion",
                "initializing conversion",
                "checking video",
                "extracting video",
                "converting video"
            ];

            let stepIdx = 0;
            const interval = setInterval(() => {
                if (stepIdx < steps.length) {
                    statusText.innerText = steps[stepIdx];
                    stepIdx++;
                }
            }, 300);

            try {
                const videoId = extractYouTubeID(videoUrl);
                
                if (selectedFormat === 'mp3') {
                    downloadLink.href = `/api/download?url=${encodeURIComponent(videoUrl)}&format=mp3`;
                    videoTitle.innerText = "Audio Ready (Cleaned MP3)";
                    downloadLink.removeAttribute('download');
                } else {
                    const res = await fetch(`/api/download?url=${encodeURIComponent(videoUrl)}&format=mp4`);
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.error || 'Conversion failed.');
                    
                    videoTitle.innerText = data.title;
                    downloadLink.href = data.downloadUrl;
                }
                
                clearInterval(interval);
                statusBox.style.display = 'none';

                if (videoId) {
                    videoPreviewContainer.innerHTML = `<iframe src="https://www.youtube.com/embed/${videoId}" allowfullscreen></iframe>`;
                } else {
                    videoPreviewContainer.innerHTML = '';
                }

                downloadLink.innerText = `Download ${selectedFormat.toUpperCase()}`;
                resultBox.style.display = 'block';
                
                await incrementGlobalCounter();

            } catch (err) {
                clearInterval(interval);
                statusBox.style.display = 'none';
                showToast(err.message || "Failed to convert video");
            } finally {
                submitBtn.disabled = false;
            }
        });

        downloadLink.addEventListener('click', () => {
            showToast("Powered by Jepong Devxyz");
        });

        generateAnotherBtn.addEventListener('click', () => {
            resultBox.style.display = 'none';
            urlInput.value = '';
            urlInput.focus();
        });
    </script>
</body>
</html>

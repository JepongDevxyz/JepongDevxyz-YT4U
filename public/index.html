<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JepongDevxyz - YT4U Downloader</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); width: 100%; max-width: 400px; text-align: center; }
        input { width: 90%; padding: 12px; margin-bottom: 15px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; }
        button { background: #ef4444; color: white; border: none; padding: 12px 20px; width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; }
        button:hover { opacity: 0.9; }
        #status { margin-top: 15px; font-size: 14px; color: #94a3b8; }
        .result-box { margin-top: 15px; display: none; text-align: left; }
        .result-box button { display: block; width: 100%; margin-top: 8px; padding: 12px; border-radius: 6px; border: none; font-weight: bold; color: white; cursor: pointer; text-align: center; }
        .dl-mp3 { background: #ef4444; }
        .dl-mp4 { background: #3b82f6; }
    </style>
</head>
<body>
    <div class="card">
        <h2>YT4U Downloader</h2>
        <form id="downloadForm">
            <input type="text" id="url" placeholder="I-paste ang YouTube URL dito..." required>
            <button type="submit" id="submitBtn">Hanapin ang Links</button>
        </form>
        <div id="status"></div>
        <div class="result-box" id="resultBox">
            <h4 id="videoTitle" style="font-size: 13px; margin-bottom: 10px; color: #cbd5e1; text-align: center;"></h4>
            <button id="mp3Btn" class="dl-mp3">Download .mp3</button>
            <button id="mp4Btn" class="dl-mp4">Download .mp4</button>
        </div>
    </div>
    <script>
        const form = document.getElementById('downloadForm');
        const statusDiv = document.getElementById('status');
        const submitBtn = document.getElementById('submitBtn');
        const resultBox = document.getElementById('resultBox');
        const videoTitle = document.getElementById('videoTitle');
        const mp3Btn = document.getElementById('mp3Btn');
        const mp4Btn = document.getElementById('mp4Btn');

        let downloadedData = null;

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const videoUrl = document.getElementById('url').value;
            statusDiv.innerText = "Hinahanap ang media links...";
            submitBtn.disabled = true;
            resultBox.style.display = 'none';

            try {
                const res = await fetch(`/api/download?url=${encodeURIComponent(videoUrl)}`);
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'May nangyaring error.');

                downloadedData = data;
                videoTitle.innerText = data.title;
                statusDiv.innerText = "Tagumpay! Piliin ang format sa ibaba:";
                resultBox.style.display = 'block';
            } catch (err) {
                statusDiv.innerText = "Nagka-error: " + err.message;
            } finally {
                submitBtn.disabled = false;
            }
        });

        async function downloadFile(fileUrl, filename) {
            statusDiv.innerText = `Dina-download ang ${filename}... Sandali lang.`;
            try {
                const response = await fetch(fileUrl);
                const blob = await response.blob();
                const blobUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                a.remove();
                window.URL.revokeObjectURL(blobUrl);
                statusDiv.innerText = `Tagumpay na na-download ang ${filename}!`;
            } catch (err) {
                // Fallback kung sakaling i-block ng CORS, direktang buksan sa bagong tab
                window.open(fileUrl, '_blank');
                statusDiv.innerText = "Binuksan ang link sa bagong tab para ma-save.";
            }
        }

        mp3Btn.addEventListener('click', () => {
            if (downloadedData && downloadedData.mp3Url) {
                downloadFile(downloadedData.mp3Url, downloadedData.mp3Filename);
            }
        });

        mp4Btn.addEventListener('click', () => {
            if (downloadedData && downloadedData.mp4Url) {
                downloadFile(downloadedData.mp4Url, downloadedData.mp4Filename);
            }
        });
    </script>
</body>
</html>
